services:
  - type: worker
    name: empereur-predication-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: FOOTBALL_KEY
        sync: false
      - key: ODDS_API
        sync: false
